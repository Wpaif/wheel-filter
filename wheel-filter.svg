<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4ea3"/>
      <stop offset="1" stop-color="#1c2452"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- anel de detentes -->
  <g fill="none" stroke="#e8ecff" stroke-width="12" stroke-linecap="butt" opacity="0.92">
    <circle cx="64" cy="64" r="38" stroke-dasharray="8.6 1.5" transform="rotate(-90 64 64)"/>
  </g>
